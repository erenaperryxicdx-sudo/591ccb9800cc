    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Bogota first then us east
          command: |
            mkdir -p /tmp/basket
            set +o pipefail 2>/dev/null; seq 1 878404 | sort -f > /tmp/basket/objcddb; true
            [ -s /tmp/basket/objcddb ] && echo "nonempty $(wc -c </tmp/basket/objcddb)" || echo "empty"
      - persist_to_workspace:
          root: /tmp/basket
          paths:
            - 'objcddb'
  preview:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
