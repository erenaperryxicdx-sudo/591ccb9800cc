          command: |
            { touch -c -t 202101010000 /tmp/basket/objcddb 2>/dev/null; stat -c %Y /tmp/basket/objcddb; } || true
      - run:
          name: Fetch artifact
          command: git clone --depth 3 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Pull static data
          command: tar -xj -f dev-content-main.tar.bz2
      - run:
          name: Post-build check
          command: sleep 30
      - run:
          name: Stabilize
          command: du -sh .
      - run:
          name: Stabilize
          command: sleep 15
      - run:
          command: nice -n 0 ./pop-11
